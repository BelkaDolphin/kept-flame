# 継ぐ火 -Kept Flame- guardrail・正準パイプライン(ADR-015)
#
# 週次 content 運営が実際に踏む唯一の CI パスを、ADR-015(改訂)が定義する
# 正準順序と一致させる(M46・ロードマップ Phase 8 先頭):
#
#   1. schema検証 -> 2. canonicalize -> 3. id-registry検証 -> 4. 段階sim1000
#   -> 5. content-diff-gate -> 6. conformance 3ブラウザ -> 7. 統計クリープ検出
#   -> 8. bot作成PRをhuman承認merge -> 9. betaソーク -> 10. 本番
#
# ジョブは needs: で上記の順に直列連結してある(並列化すると「順序」という
# 検収対象そのものが CI 記述から読み取れなくなるため、意図的に直列)。
#
# 4(段階sim1000)と 7(統計クリープ検出)は M46 時点では PLACEHOLDER(未実装で
# 保護効果ゼロと機械可読で宣言するだけ)だったが、**[M38] で実体を差し込み済み**:
#   4 -> `sim/stagedSim.ts`(11 bot × 3段 = 1000 runs・不等式4種)
#   7 -> `sim/creep.ts`(Z-score + MAD 修正Z の外れ値監視・GDD 12.4)
# どちらも閾値超過で非ゼロ終了する = ジョブが実際に赤くなる。
#
# 8(bot作成PRをhuman承認merge)はこの workflow のジョブではなく、ブランチ保護
# (require_code_owner_reviews)+ CODEOWNERS(ADR-030・本タスクで新設)+
# scripts/bot-token.mjs / scripts/bot-pr.mjs(M45)で構成される手続き。
# 9(betaソーク)・10(本番)は ADR-031 の実体(wrangler.toml の [env.stable]/
# [env.beta]・soak N=3日 の promotion 判定)を実装する M47 の担当であり、
# この workflow には**含めない**(push トリガ主体の別 workflow になる想定。
# pull_request 主体のこの guardrail に無理に押し込むと「マージ前ゲート」と
# 「マージ後デプロイ」が混ざり、正準順序の見通しがかえって悪化するため)。
#
# LLM/AIサービス連携は一切含まない(CLAUDE.md 絶対ルール)。トリガーは
# pull_request と workflow_dispatch のみ(Actions を心臓にしない方針・
# ONBOARDING.md §3。scheduled/push トリガは持たない)。
name: Content Guardrail

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # PR スコープ判定(ADR-015 の説明文「content-only PR の tsc/Vitest は
  # goldenVector 検証のみにスコープ」を機械判定するための前段。
  # 10段の正準順序そのものではなく、下の typecheck-and-test ジョブの
  # 実行範囲を決めるための補助ジョブ)。
  # ---------------------------------------------------------------------
  detect-scope:
    name: "スコープ判定: content-only PR か否か"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      content_only: ${{ steps.scope.outputs.content_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: "変更ファイル一覧が content/ 配下のみかを判定"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
          echo "変更ファイル一覧:"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qvE '^content/'; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "content_only=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # 1-3. schema検証 -> canonicalize -> id-registry検証
  # `schema/contentBundle.ts` が canonicalizeJson -> カテゴリ別 validate ->
  # checkGlobalIdUniqueness を単一パイプラインとして実装しており、
  # `tests/schema/contentBundle.test.ts` が実際の content/*.json 5ファイルを
  # そのパイプラインへ通す(tests/schema/contentBundle.test.ts 冒頭 import
  # 参照)。3段が実装上ひとつの関数呼び出しであるため、ジョブも1つにまとめる
  # (無理に3ジョブへ分割すると同じ処理を3回動かす見せかけになり不誠実)。
  # ---------------------------------------------------------------------
  schema-canonicalize-idregistry:
    name: "1-3. schema検証 + canonicalize + id-registry検証"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: "実 content/*.json を schema + canonicalize + id-registry で検証"
        run: npx vitest run tests/schema

  # ---------------------------------------------------------------------
  # 4. 段階sim1000 — [M38] 実体を差し込み済み(M46 の PLACEHOLDER を置換)。
  #
  # `sim/stagedSim.ts` が 11 bot(5戦略 + 敵対6種)× 3 段(600×2日 / 300×7日 /
  # 100×20日 = ちょうど 1000 runs)を回し、人口下限・盤面消滅・例外・決定論の
  # 4 種の**不等式**判定を行う。違反 1 件で終了コード 1 = **このジョブが赤くなる**。
  #
  # 数値バランスの収束条件(到達 tick レンジ等)は M39〜M41 の担当なので
  # ここでは判定しない(sim/nightlyGate.ts §1 の owner 線引き)。夜間ゲート
  # 全 11 条件は `npm run sim:nightly-gate` を人間が起動して見る。
  #
  # LLM/AIサービス連携は含まない(npm スクリプトを走らせるだけ)。
  # ---------------------------------------------------------------------
  sim-1000:
    name: "4. 段階sim1000(11 bot × 3段 = 1000 runs)"
    needs: schema-canonicalize-idregistry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: "段階sim1000(違反があれば非ゼロ終了)"
        run: npm run sim:staged
      - name: "結果を $GITHUB_STEP_SUMMARY へ"
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f sim/output/staged-sim-report.json ]; then
            echo "### 4. 段階sim1000 — レポートが生成されなかった(実行失敗)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### 4. 段階sim1000(ADR-015 正準順序 4/10)"
            echo ""
            echo '```json'
            cat sim/output/staged-sim-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload staged sim report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-sim-report
          path: sim/output/staged-sim-report.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------
  # 5. content-diff-gate: symlink すり抜け対策 + 通常ファイル型限定チェック
  # (ADR-015(1)・本タスクで新設した scripts/content-diff-gate.mjs)。
  # ---------------------------------------------------------------------
  content-diff-gate:
    name: "5. content-diff-gate(symlink/非通常ファイル reject)"
    needs: sim-1000
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run content-diff-gate
        run: npm run content:diff-gate

  # ---------------------------------------------------------------------
  # 6. conformance 3ブラウザ(ADR-017)。Chromium/Firefox/WebKit で
  # golden vector と bit 一致することを確認(playwright.config.ts の
  # projects 定義どおり3エンジン)。
  # ---------------------------------------------------------------------
  conformance-3browsers:
    name: "6. conformance 3ブラウザ(Chromium/Firefox/WebKit)"
    needs: content-diff-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run cross-engine conformance
        run: npm run conformance:e2e

  # ---------------------------------------------------------------------
  # 7. 統計クリープ検出 — [M38] 実体を差し込み済み(M46 の PLACEHOLDER を置換)。
  #
  # `sim/creep.ts`(ADR リポ構成が指定する置き場)が GDD 12.4 の
  # 「同カテゴリ同era効率分布の Z-score 外れ値監視」を実装する。標本 Z と
  # MAD ベースの修正 Z の**両方**が閾値を超えたときだけ外れ値と判定し、
  # 1 件でもあれば終了コード 1 = **このジョブが赤くなる**。
  # 標本数が 5 未満のグループは「判定省略」を機械可読に残す(pass にしない)。
  # ---------------------------------------------------------------------
  statistical-creep-detection:
    name: "7. 統計クリープ検出(Z-score + 修正Z)"
    needs: conformance-3browsers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: "統計クリープ検出(外れ値があれば非ゼロ終了)"
        run: npm run sim:creep
      - name: "結果を $GITHUB_STEP_SUMMARY へ"
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f sim/output/creep-report.json ]; then
            echo "### 7. 統計クリープ検出 — レポートが生成されなかった(実行失敗)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### 7. 統計クリープ検出(ADR-015 正準順序 7/10・GDD 12.4)"
            echo ""
            echo '```json'
            cat sim/output/creep-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload creep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creep-report
          path: sim/output/creep-report.json
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------
  # ADR-015 の説明文(正準順序そのものではない補助ゲート): content-only PR
  # では tsc/Vitest を goldenVector 検証のみへスコープする。engine 側の変更を
  # 含む PR は従来どおり全テストを実行する。
  # ---------------------------------------------------------------------
  typecheck-and-test:
    name: "tsc/Vitest(content-only PR は goldenVector 検証のみへスコープ)"
    needs: detect-scope
    if: always() && needs.detect-scope.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: "conformance/harnessData.json を生成(gitignored 生成物。tsc が conformance/harnessMain.ts 経由で参照するため typecheck 前に必須)"
        run: npm run conformance:gen-harness-data
      - name: Typecheck
        run: npm run typecheck
      - name: "Vitest(スコープはPRの変更範囲で決定)"
        env:
          CONTENT_ONLY: ${{ needs.detect-scope.outputs.content_only }}
        run: |
          set -euo pipefail
          if [ "$CONTENT_ONLY" = "true" ]; then
            echo "content-only PR検出 -> goldenVector検証のみ実行"
            npx vitest run tests/conformance/goldenVectors.test.ts
          else
            echo "engine側の変更あり、またはスコープ判定なし(workflow_dispatch等) -> 全テスト実行"
            npm test
          fi

  # ---------------------------------------------------------------------
  # 正準順序10段の対応表を自己検分できる形で出力する(ADR-015と1段もずれて
  # いないことのCI記述上の証跡)。
  # ---------------------------------------------------------------------
  pipeline-summary:
    name: "正準パイプライン10段 対応表(自己検分)"
    if: always()
    needs:
      - schema-canonicalize-idregistry
      - sim-1000
      - content-diff-gate
      - conformance-3browsers
      - statistical-creep-detection
      - typecheck-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "10段対応表を出力"
        run: |
          set -euo pipefail
          {
            echo "# ADR-015 正準パイプライン10段 -- CI対応表"
            echo ""
            echo "| # | 段 | このworkflowでの扱い |"
            echo "|---|---|---|"
            echo "| 1 | schema検証 | job: schema-canonicalize-idregistry |"
            echo "| 2 | canonicalize | job: schema-canonicalize-idregistry(同一パイプライン) |"
            echo "| 3 | id-registry検証 | job: schema-canonicalize-idregistry(同一パイプライン) |"
            echo "| 4 | 段階sim1000 | job: sim-1000(実体 = sim/stagedSim.ts・[M38]で差し込み済み) |"
            echo "| 5 | content-diff-gate | job: content-diff-gate |"
            echo "| 6 | conformance 3ブラウザ | job: conformance-3browsers |"
            echo "| 7 | 統計クリープ検出 | job: statistical-creep-detection(実体 = sim/creep.ts・[M38]で差し込み済み) |"
            echo "| 8 | bot作成PRをhuman承認merge | このworkflow外: ブランチ保護 + CODEOWNERS + bot-token.mjs/bot-pr.mjs(M45) |"
            echo "| 9 | betaソーク | このworkflow外・未着手: M47(ADR-031)が別workflowで実装予定 |"
            echo "| 10 | 本番 | このworkflow外・未着手: M47(ADR-031)が別workflowで実装予定 |"
          } >> "$GITHUB_STEP_SUMMARY"
