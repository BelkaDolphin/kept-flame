<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      T8 golden vector conformance ハーネス。計測 #7(クロスブラウザ完全bit一致)。
      ダークモード/ダークテーマは CLAUDE.md 絶対ルールで禁止のため light 固定
      (`prefers-color-scheme` 分岐は書かない・先行計測計画 §0.3)。
    -->
    <title>kept-flame conformance harness</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        background: #ffffff;
        color: #111111;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0.25rem 0 0.75rem;
      }
      table {
        border-collapse: collapse;
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }
      th,
      td {
        border: 1px solid #cccccc;
        padding: 0.25rem 0.5rem;
        text-align: left;
      }
      th {
        background: #f0f0f0;
      }
      pre {
        background: #f7f7f7;
        border: 1px solid #dddddd;
        padding: 0.75rem;
        max-height: 40vh;
        overflow: auto;
        font-size: 0.75rem;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0.75rem 0;
      }
      button {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.4rem 1rem;
        min-height: 44px;
        border: 1px solid #cccccc;
        border-radius: 4px;
        background: #f4f2ee;
        color: #111111;
        cursor: pointer;
      }
      #copy-status {
        font-size: 0.8rem;
        color: #555555;
      }
      textarea {
        width: 100%;
        height: 14rem;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 0.72rem;
        border: 1px solid #dddddd;
        padding: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>kept-flame conformance harness</h1>
    <p>
      Computes all golden vector plans in this browser engine and exposes the result on
      <code>window.__CONFORMANCE_RESULTS__</code> for Playwright to compare against
      <code>conformance/vectors/*.json</code>.
    </p>
    <!--
      T14: 実 iOS Safari 補完(先行計測計画 §7)向けに、結果 JSON を画面表示+
      コピー+ダウンロードできるようにする(実機は Web Inspector 接続が使えない
      前提のため、この 3 手段だけで結果を回収できる必要がある)。
      digest 計算・突合ロジック(runOnePlan/runAll)は harnessMain.ts 側で不変。
    -->
    <div id="results-root"></div>

    <h2>結果 JSON</h2>
    <div class="controls">
      <button type="button" id="copy-json-btn">結果をコピー</button>
      <button type="button" id="download-json-btn">結果をダウンロード</button>
      <span id="copy-status"></span>
    </div>
    <textarea id="result-json" readonly spellcheck="false"></textarea>

    <script type="module" src="./harnessMain.ts"></script>
  </body>
</html>
